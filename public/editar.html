    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">

        <a class="navbar-brand" href="#">Horoscopo Firebase</a>

  </header>

  <main class="row">
    <h4 class="formatHead">Editar Signo Zodiacal</h4>
    <div class="formatDiv">
      <input type="hidden" id="txtId">
      <label for="txtPosic">Posicion:</label><br>
      <input type="text" id="txtPosic" required><br><br>

      <label for="txtSigno">Signo:</label><br>
      <input type="text" id="txtSigno" required><br><br>

      <label for="txtRango">Rango (fechas):</label><br>
      <input type="text" id="txtRango" required><br><br>

      <label for="txtElemento">Elemento:</label><br>
      <select id="txtElemento" required>
        <option value="Fuego">Fuego</option>
        <option value="Tierra">Tierra</option>
        <option value="Aire">Aire</option>
        <option value="Agua">Agua</option>
      </select><br><br>

      <label for="txtAstro">Astro celeste asociado:</label><br>
      <input type="text" id="txtAstro" required><br><br>

      <label for="txtPiedra">Piedra preciosa:</label><br>
      <input type="text" id="txtPiedra" required><br><br>

      <img id="imgPreview" src="" alt="Signo" class="imgPreview oculto">
      <br><br>
      <input type="button" id="btnUpdate" name="btnUpdate" value="Actualizar">
      <input type="button" id="btnCancel" name="btnCancel" value="Volver" class="btn-secundo">
    </div>
  </main>

  <footer class="row"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"

  <script defer src="js/users/idle.js"></script>
  <script>
    window.addEventListener('load', () => {
      validar();
      console.log('La pagina esta completamente cargada');
    });
  </script>
  <!-- load js code to edit sign  -->
  <script defer src="js/zodiac/editSigno.js"></script>

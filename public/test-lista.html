    crossorigin="anonymous">

</head>
<body class="container">
  <header class="header row">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Horoscopo Firebase</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
          aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="login.html">Iniciar sesion</a>

            <li class="nav-item">
              <a class="nav-link" href="registrar.html">Registrar usuario</a>

              <a class="nav-link text-white" href="#">Cerrar sesion</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="row">
    <h4 class="formatHead">Lista de Signos Zodiacales - Prueba Local</h4>
    <p>Imágenes cargadas desde carpeta local <code>public/zodiaco/</code></p>
    <div id="tabla" class="row"></div>
  </main>

  <footer class="row">Test Local - ITI-621</footer>

  <script>
    const signos = [
      { posic: 1, signo: 'Acuario', rango: 'Ene/20 - Feb/18', elemento: 'Aire', astro: 'Urano', piedra: 'Amatista', img: '01_Acuario.png' },
      { posic: 2, signo: 'Piscis', rango: 'Feb/19 - Mar/20', elemento: 'Agua', astro: 'Neptuno', piedra: 'Aguamarina', img: '02_Pisis.png' },
      { posic: 3, signo: 'Aries', rango: 'Mar/21 - Abr/19', elemento: 'Fuego', astro: 'Marte', piedra: 'Diamante', img: '03_Aries.png' },
      { posic: 4, signo: 'Tauro', rango: 'Abr/20 - May/20', elemento: 'Tierra', astro: 'Venus', piedra: 'Esmeralda', img: '04_Tauro.png' },
      { posic: 5, signo: 'Géminis', rango: 'May/21 - Jun/20', elemento: 'Aire', astro: 'Mercurio', piedra: 'Ágata', img: '05_Geminis.png' },
      { posic: 6, signo: 'Cáncer', rango: 'Jun/21 - Jul/22', elemento: 'Agua', astro: 'Luna', piedra: 'Perla', img: '06_Cancer.png' },
      { posic: 7, signo: 'Leo', rango: 'Jul/23 - Ago/22', elemento: 'Fuego', astro: 'Sol', piedra: 'Rubí', img: '07_Leo.png' },
      { posic: 8, signo: 'Virgo', rango: 'Ago/23 - Sep/22', elemento: 'Tierra', astro: 'Mercurio', piedra: 'Zafiro', img: '08_Virgo.png' },
      { posic: 9, signo: 'Libra', rango: 'Sep/23 - Oct/22', elemento: 'Aire', astro: 'Venus', piedra: 'Ópalo', img: '09_Libra.png' },
      { posic: 10, signo: 'Escorpio', rango: 'Oct/23 - Nov/21', elemento: 'Agua', astro: 'Plutón', piedra: 'Topacio', img: '10_Escorpio.png' },
      { posic: 11, signo: 'Sagitario', rango: 'Nov/22 - Dic/21', elemento: 'Fuego', astro: 'Júpiter', piedra: 'Turquesa', img: '11_Sagitario.png' },
      { posic: 12, signo: 'Capricornio', rango: 'Dic/22 - Ene/19', elemento: 'Tierra', astro: 'Saturno', piedra: 'Granate', img: '12_Capricornio.png' }
    ];

    const tabla = document.getElementById('tabla');
    let salida = '';
    signos.forEach(s => {
      salida += '<div class="divAnuncio m-3" style="cursor:pointer;">';
      salida += '<div class="imgBlock"><img src="zodiaco/' + s.img + '" width="100%"/></div>';
      salida += '<div class="signo-titulo">' + s.signo + '</div>';
      salida += '<div class="dato-extra">' + s.rango + '</div>';
      salida += '<div class="dato-extra">Elemento: ' + s.elemento + '</div>';
      salida += '<div class="dato-extra">Astro: ' + s.astro + '</div>';
      salida += '<div class="dato-extra">Piedra: ' + s.piedra + '</div>';
      salida += '<br/><div class="accion">Haz clic para editar</div>';
      salida += '</div>';
    });
    tabla.innerHTML = salida;
  </script>
</body>
</html>
